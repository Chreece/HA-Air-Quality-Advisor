<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="310" viewBox="0 0 1400 310" role="img" aria-labelledby="title desc">
<title id="title">How Home Environment Manager works</title><desc id="desc">Home Assistant room sensors and optionally configured international data providers feed evidence-aware environmental calculations. The manager provides actionable recommendations and optional Announcement Hub notifications. PID climate device control is planned separately.</desc>
<defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#0D2A3B"/><stop offset="1" stop-color="#124954"/></linearGradient></defs>
<rect width="1400" height="310" rx="20" fill="url(#g)"/>
<g font-family="DejaVu Sans,Arial,sans-serif">
<g transform="translate(28 48)"><rect width="305" height="219" rx="18" fill="#1C4C62" stroke="#5689A4"/><text x="20" y="36" font-size="16" fill="#7DE0DC" font-weight="700">01  MEASURE</text><text x="20" y="74" font-size="23" fill="white" font-weight="700">Sensors &amp; weather</text><g font-size="15" fill="#C6DEE6"><text x="20" y="108">Temperature · Humidity · CO₂</text><text x="20" y="137">Particles · Outdoor pollution</text><text x="20" y="166">Optional radon, light, noise</text><text x="20" y="195">International provider inputs</text></g></g>
<g transform="translate(375 48)"><rect width="305" height="219" rx="18" fill="#1B5B60" stroke="#68D5C6"/><text x="20" y="36" font-size="16" fill="#86F4D5" font-weight="700">02  ANALYZE</text><text x="20" y="74" font-size="23" fill="white" font-weight="700">Building science</text><g font-size="15" fill="#D0EAE9"><text x="20" y="108">Drying potential · PM trends</text><text x="20" y="137">Thermal comfort · Dew point</text><text x="20" y="166">Ventilation effectiveness</text><text x="20" y="195">Evidence &amp; uncertainty checks</text></g></g>
<g transform="translate(722 48)"><rect width="305" height="219" rx="18" fill="#174D69" stroke="#69A7CB"/><text x="20" y="36" font-size="16" fill="#A7E5FF" font-weight="700">03  RECOMMEND</text><text x="20" y="74" font-size="23" fill="white" font-weight="700">Room-aware advice</text><g font-size="15" fill="#D0E2EC"><text x="20" y="108">Ventilate · Close windows</text><text x="20" y="137">Filtration &amp; extraction</text><text x="20" y="166">Passive cooling · Comfort</text><text x="20" y="195">Unknown is never assumed safe</text></g></g>
<g transform="translate(1069 48)"><rect width="302" height="219" rx="18" fill="#243E59" stroke="#6B90AF"/><text x="20" y="36" font-size="16" fill="#D0C3FF" font-weight="700">04  DELIVER</text><text x="20" y="74" font-size="23" fill="white" font-weight="700">Local Home Assistant</text><g font-size="15" fill="#D5DBEC"><text x="20" y="108">Lovelace · Sensor attributes</text><text x="20" y="137">Optional Announcement Hub</text><text x="20" y="166">Translated, room-targeted alerts</text><text x="20" y="195">Future: opt-in climate PID</text></g></g>
