name: Validate (manual only)

# Intentionally avoid push/PR/schedule triggers to prevent noisy CI notifications
# during iterative development; run once when preparing a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pure decision-engine tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Card syntax and rendering smoke test
        run: |
          node --check custom_components/air_quality_advisor/frontend/air-quality-advisor-card.js
          node tests/card_test.cjs
      - name: Syntax and JSON check
        run: |
          python -m compileall -q custom_components
          python -m json.tool hacs.json > /dev/null
          python -m json.tool custom_components/air_quality_advisor/manifest.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('custom_components/air_quality_advisor').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          print('Translations validated')
          PY
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
