name: Validate and release (after push)

# A completed push to main starts validation. Only the final validated HEAD
# gets a release; manual dispatch can run validation without publishing.
on:
  push:
    branches:
      - main
      - 'feat/research-based-indoor-environment-*'
      - 'feat/home-environment-advisor-*'
      - 'feat/home-environment-manager-pid-*'
      - 'feat/home-environment-climate-profiles-*'
      - 'beta/v0.6.0b1'
      - 'beta/v0.6.0b2'
      - 'beta/v0.6.0b3'
      - 'beta/v0.6.0b4'
      - 'beta/v0.6.0b6'
      - 'feat/compact-environment-settings-*'
      - 'feat/metric-help-valid-selectors-*'
      - 'fix/initial-flow-retry-*'
      - 'feat/full-config-i18n-help-*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the versioned GitHub/HACS release after all checks pass'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: air-quality-advisor-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pure decision-engine tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests
      - name: Verify translations match generator
        run: |
          python generate_translations.py
          git diff --exit-code -- custom_components/air_quality_advisor/strings.json custom_components/air_quality_advisor/translations
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Card syntax and rendering smoke test
        run: |
          node --check custom_components/air_quality_advisor/frontend/air-quality-advisor-card.js
          node tests/card_test.cjs
      - name: Syntax and JSON check
        run: |
          python -m compileall -q custom_components
          python -m json.tool hacs.json > /dev/null
          python -m json.tool custom_components/air_quality_advisor/manifest.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('custom_components/air_quality_advisor').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          print('Translations validated')
          PY
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Strict integration checks; ignore only missing GitHub About metadata.
          # For listing in the default HACS catalog, remove this exception.
          ignore: description topics

  publish:
    name: Publish versioned HACS release
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true))
    needs: [test, hassfest, hacs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check requested version and release notes
        id: metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, re
          request = json.loads(Path('.github/release-request.json').read_text(encoding='utf-8'))
          version = request.get('version', '')
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), f'Invalid release version: {version}'
          manifest = json.loads(Path('custom_components/air_quality_advisor/manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == version, f"Manifest {manifest['version']} differs from request {version}"
          tag = f'v{version}'
          notes = Path(f'.github/releases/{tag}.md')
          assert notes.is_file() and notes.stat().st_size > 200, f'Missing release notes: {notes}'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              print(f'tag={tag}', file=out)
              print(f'notes={notes}', file=out)
          PY
      - name: Verify this commit is current and the version is unreleased
        id: eligibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "::notice::Superseded by $current_sha; skipping obsolete release"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $RELEASE_TAG already exists; no duplicate"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists without a release; refusing to repoint it"
            exit 1
          fi
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
      - name: Build manual integration ZIP
        if: steps.eligibility.outputs.should_publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          mkdir -p dist
          zip -q -r "dist/HA-Air-Quality-Advisor-${RELEASE_TAG}.zip" custom_components/air_quality_advisor \
            -x '*__pycache__*' '*.pyc'
      - name: Create release at the validated commit
        if: steps.eligibility.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_NOTES: ${{ steps.metadata.outputs.notes }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "::notice::New push arrived during packaging; skip obsolete release"
            exit 0
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $RELEASE_TAG already published; no duplicate"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG exists without a published release"
            exit 1
          fi
          gh release create "$RELEASE_TAG" "dist/HA-Air-Quality-Advisor-${RELEASE_TAG}.zip#Manual installation ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Home Environment Manager ${RELEASE_TAG}" \
            --notes-file "$RELEASE_NOTES" \
            --latest

  publish_beta:
    name: Publish opt-in v0.6.0b6 prerelease only after all checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta/v0.6.0b6'
    needs: [test, hassfest, hacs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate beta metadata and release notes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("custom_components/air_quality_advisor/manifest.json")
          manifest = json.loads(p.read_text(encoding="utf-8"))
          request = json.loads(Path(".github/release-request.json").read_text(encoding="utf-8"))
          hacs = json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          assert manifest["domain"] == "air_quality_advisor"
          assert manifest["name"] == "Home Environment Manager"
          assert manifest["version"] == "0.6.0b6"
          assert request["version"] == manifest["version"]
          assert request["channel"] == "beta"
          assert request["release_branch"] == "beta/v0.6.0b6"
          # HACS reads release tag tree directly. Never change the default
          # channel's installation contract for old stable releases.
          assert hacs.get("zip_release") is not True
          assert Path(".github/releases/v0.6.0b6.md").stat().st_size > 1500
          for item in ("icon.png", "icon@2x.png", "logo.png", "logo@2x.png"):
              assert (p.parent / "brand" / item).is_file(), item
          print("Exact prerelease identity, HACS source-tree mode, brand and notes: PASS")
          PY
      - name: Verify beta branch HEAD and immutable release eligibility
        shell: bash
        id: eligibility_beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "::notice::Superseded beta HEAD; no release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view v0.6.0b6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::This beta was already published; never replace its tag"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.6.0b6" >/dev/null 2>&1; then
            echo "::error::Existing orphan tag v0.6.0b6; refusing to move tag"
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Package and smoke-test manual installation ZIP
        if: steps.eligibility_beta.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -q -r dist/HA-Home-Environment-Manager-v0.6.0b6.zip custom_components/air_quality_advisor \
            -x '*__pycache__*' '*.pyc' '*.pyo' '.DS_Store'
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path
          archive = Path("dist/HA-Home-Environment-Manager-v0.6.0b6.zip")
          prefix = "custom_components/air_quality_advisor/"
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              names = [name for name in z.namelist() if not name.endswith("/")]
              assert names and all(name.startswith(prefix) for name in names)
              assert not any("__pycache__" in n or n.endswith((".pyc",".pyo")) for n in names)
              version = json.loads(z.read(prefix+"manifest.json"))["version"]
              assert version == "0.6.0b6"
              for path in ("__init__.py","sensor.py","icons.json",
                           "frontend/air-quality-advisor-card.js",
                           "brand/icon.png","brand/icon@2x.png",
                           "brand/logo.png","brand/logo@2x.png",
                           "translations/en.json"):
                  assert prefix+path in names,path
              print("Manual installation archive: verified",len(names),"files")
          PY
          sha256sum dist/HA-Home-Environment-Manager-v0.6.0b6.zip > dist/HA-Home-Environment-Manager-v0.6.0b6.zip.sha256
      - name: Publish GitHub prerelease without changing stable latest
        if: steps.eligibility_beta.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "::notice::Superseded while packaging; skip"
            exit 0
          fi
          if gh release view v0.6.0b6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Already published; never overwrite"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.6.0b6" >/dev/null 2>&1; then
            echo "::error::Orphan tag, refuse to repoint"
            exit 1
          fi
          gh release create v0.6.0b6 \
            'dist/HA-Home-Environment-Manager-v0.6.0b6.zip#Manual installation ZIP' \
            'dist/HA-Home-Environment-Manager-v0.6.0b6.zip.sha256#SHA-256 checksum' \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Home Environment Manager v0.6.0 beta 1' \
            --notes-file .github/releases/v0.6.0b6.md \
            --prerelease --latest=false
