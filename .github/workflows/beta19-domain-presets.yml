name: Environment Manager domain and room preset migration
on:
  push:
    branches: ['feat/environment-manager-domain-presets-beta19-20261023','beta/v0.6.0b19']
permissions:
  contents: read
concurrency:
  group: beta19-domain-presets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13','3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build migration candidate when staging helper exists
        run: |
          if [ -f .github/apply-beta19-domain.py ]; then python .github/apply-beta19-domain.py; fi
      - run: python -m pip install pytest
      - name: Full regression suite
        run: |
          python -m pytest -q tests
          python generate_translations.py
          python -m compileall -q custom_components
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check custom_components/environment_manager/frontend/air-quality-advisor-card.js
          node tests/card_test.cjs
      - name: Canonical package assertions
        run: |
          test -d custom_components/environment_manager
          test ! -d custom_components/air_quality_advisor
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('custom_components/environment_manager/manifest.json').read_text())
          assert m['domain']=='environment_manager'
          PY
      - name: Reproducible generated catalogs on final beta
        if: github.ref == 'refs/heads/beta/v0.6.0b19'
        run: git diff --exit-code -- custom_components/environment_manager/strings.json custom_components/environment_manager/translations custom_components/environment_manager/equipment_text.py

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: |
          if [ -f .github/apply-beta19-domain.py ]; then python .github/apply-beta19-domain.py; fi
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: |
          if [ -f .github/apply-beta19-domain.py ]; then python .github/apply-beta19-domain.py; fi
      - uses: hacs/action@main
        with:
          category: integration
          ignore: description topics

  home_assistant:
    name: Actual HA domain/registry migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: |
          if [ -f .github/apply-beta19-domain.py ]; then python .github/apply-beta19-domain.py; fi
      - run: python -m pip install 'homeassistant==2026.10.0'
      - run: |
          python tools/verify_domain_migration_ha.py
          python tools/verify_room_hubs_ha.py
          python tools/verify_room_setup_ha.py
          python tools/verify_beta15_settings_ha.py

  save_source:
    if: github.ref == 'refs/heads/feat/environment-manager-domain-presets-beta19-20261023'
    needs: [test,hassfest,hacs,home_assistant]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Commit exact validated canonical source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f .github/apply-beta19-domain.py ]; then exit 0; fi
          python .github/apply-beta19-domain.py
          git rm .github/apply-beta19-domain.py
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feat/environment-manager-domain-presets-beta19-20261023" --jq '.object.sha')"
          test "$current" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(beta19): canonical environment_manager domain with one-click legacy migration'
          git push origin HEAD:refs/heads/feat/environment-manager-domain-presets-beta19-20261023
          echo "VALIDATED_SOURCE_SHA=$(git rev-parse HEAD)"
          echo "VALIDATED_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
