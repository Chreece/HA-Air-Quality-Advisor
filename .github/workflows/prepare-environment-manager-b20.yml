name: Prepare environment_manager domain b20
on:
  push:
    branches: ['migration/environment-manager-domain-b20-20261023']
permissions:
  contents: read
concurrency:
  group: environment-manager-b20-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13','3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python .github/prepare_environment_manager_b20.py
      - run: python -m pip install pytest
      - name: Full regression suite
        run: |
          python -m pytest -q tests
          python generate_translations.py
          python -m compileall -q custom_components/environment_manager
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check custom_components/environment_manager/frontend/air-quality-advisor-card.js
          node tests/card_test.cjs
      - name: Show intentional legacy references
        run: |
          grep -R -n 'air_quality_advisor' custom_components/environment_manager || true

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python .github/prepare_environment_manager_b20.py
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python .github/prepare_environment_manager_b20.py
      - uses: hacs/action@main
        with:
          category: integration
          ignore: description topics

  domain_switch:
    name: Actual HA b19 to b20 domain switch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python .github/prepare_environment_manager_b20.py
      - run: python -m pip install 'homeassistant==2026.10.0'
      - run: |
          python tools/verify_domain_switch_ha.py
          python tools/verify_room_hubs_ha.py
          python tools/verify_room_setup_ha.py
          python tools/verify_beta15_settings_ha.py

  save_source:
    needs: [test,hassfest,hacs,domain_switch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Commit exact validated environment_manager source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -d custom_components/environment_manager ] && [ ! -d custom_components/air_quality_advisor ]; then
            echo 'Source already transformed'
            exit 0
          fi
          python .github/prepare_environment_manager_b20.py
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/migration/environment-manager-domain-b20-20261023" --jq '.object.sha')"
          test "$current" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(beta20): migrate Home Assistant domain to environment_manager'
          git push origin HEAD:refs/heads/migration/environment-manager-domain-b20-20261023
          echo "ENVIRONMENT_MANAGER_SOURCE_SHA=$(git rev-parse HEAD)"
