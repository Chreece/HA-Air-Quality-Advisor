name: General sources, Task AI, TTS languages, Home hub and away cooldown
on:
  push:
    branches: ['fix/general-home-beta16-20261023', 'beta/v0.6.0b16']
permissions:
  contents: read
concurrency:
  group: beta16-general-home-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Generate translations
        run: python generate_translations.py
      - name: Full regression suite
        run: |
          python -m pytest -q tests
          python -m compileall -q custom_components
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend
        run: |
          node --check custom_components/air_quality_advisor/frontend/air-quality-advisor-card.js
          node tests/card_test.cjs
      - name: Require reproducible catalogs on beta branch
        if: github.ref == 'refs/heads/beta/v0.6.0b16'
        run: git diff --exit-code -- custom_components/air_quality_advisor/strings.json custom_components/air_quality_advisor/translations

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python generate_translations.py
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python generate_translations.py
      - uses: hacs/action@main
        with:
          category: integration
          ignore: description topics

  home_assistant:
    name: Actual HA registries and setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python generate_translations.py
      - run: python -m pip install 'homeassistant==2026.10.0'
      - run: |
          python tools/verify_room_hubs_ha.py
          python tools/verify_room_setup_ha.py
          python tools/verify_beta15_settings_ha.py

  save_catalogs:
    if: github.ref == 'refs/heads/fix/general-home-beta16-20261023'
    needs: [test, hassfest, hacs, home_assistant]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Save generated catalogs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python generate_translations.py
          if git diff --quiet -- custom_components/air_quality_advisor/strings.json custom_components/air_quality_advisor/translations; then
            echo 'Catalogs already reproducible'
            exit 0
          fi
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/fix/general-home-beta16-20261023" --jq '.object.sha')"
          test "$current" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/air_quality_advisor/strings.json custom_components/air_quality_advisor/translations
          git commit -m 'i18n(beta16): regenerate general Home settings catalogs'
          git push origin HEAD:refs/heads/fix/general-home-beta16-20261023


  publish_beta:
    if: github.ref == 'refs/heads/beta/v0.6.0b16'
    needs: [test, hassfest, hacs, home_assistant]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact release metadata and reproducible catalogs
        run: |
          set -euo pipefail
          python generate_translations.py
          git diff --exit-code -- custom_components/air_quality_advisor/strings.json custom_components/air_quality_advisor/translations
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('custom_components/air_quality_advisor/manifest.json').read_text())
          request=json.loads(Path('.github/release-request.json').read_text())
          assert manifest['version']==request['version']=='0.6.0b16'
          assert manifest['domain']=='air_quality_advisor'
          assert manifest['integration_type']=='hub'
          assert request['channel']=='beta'
          assert request['release_branch']=='beta/v0.6.0b16'
          note=Path('.github/releases/v0.6.0b16.md')
          assert note.stat().st_size > 1500
          assert 'physical' in note.read_text().lower()
          PY
      - name: Package and verify manual installation ZIP
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -q -r dist/HA-Home-Environment-Manager-v0.6.0b16.zip custom_components/air_quality_advisor -x '*__pycache__*' '*.pyc' '*.pyo'
          python - <<'PY'
          import json, zipfile
          path='dist/HA-Home-Environment-Manager-v0.6.0b16.zip'
          prefix='custom_components/air_quality_advisor/'
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              assert all(name.startswith(prefix) for name in z.namelist())
              assert not any('__pycache__' in name or name.endswith(('.pyc','.pyo')) for name in z.namelist())
              assert json.loads(z.read(prefix+'manifest.json'))['version']=='0.6.0b16'
              for name in (
                  'room_setup.py','tts_languages.py','ai_rewrite.py','occupancy_policy.py',
                  'room_hubs.py','device_hierarchy.py','sensor.py','translations/el.json',
                  'frontend/air-quality-advisor-card.js',
              ):
                  assert prefix+name in z.namelist(), name
              for name in z.namelist():
                  if name.endswith('.json'):
                      json.loads(z.read(name))
          PY
          sha256sum dist/HA-Home-Environment-Manager-v0.6.0b16.zip > dist/HA-Home-Environment-Manager-v0.6.0b16.zip.sha256
      - name: Publish immutable opt-in beta, never stable Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/beta/v0.6.0b16" --jq '.object.sha')"
          test "$current" = "$GITHUB_SHA"
          if gh release view v0.6.0b16 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.6.0b16" >/dev/null 2>&1; then
            echo 'Existing orphan tag; refusing to overwrite'
            exit 1
          fi
          gh release create v0.6.0b16 \
            dist/HA-Home-Environment-Manager-v0.6.0b16.zip \
            dist/HA-Home-Environment-Manager-v0.6.0b16.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Home Environment Manager v0.6.0 beta 16' \
            --notes-file .github/releases/v0.6.0b16.md --prerelease --latest=false
