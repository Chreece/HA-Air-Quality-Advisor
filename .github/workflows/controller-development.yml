name: Controller development verification
on:
  push:
    branches: ['feat/device-climate-controllers-*']
permissions:
  contents: read
concurrency:
  group: controller-development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Apply exact development checkpoint when requested
        run: python tools/apply_area_hub_checkpoint.py
      - name: Regression tests and deterministic translations
        run: |
          python -m pip install pytest
          python -m pytest -q tests
          python generate_translations.py
          git diff --exit-code -- custom_components/air_quality_advisor/strings.json custom_components/air_quality_advisor/translations
          python -m compileall -q custom_components
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend validation
        run: |
          node --check custom_components/air_quality_advisor/frontend/air-quality-advisor-card.js
          node tests/card_test.cjs
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - run: python tools/apply_area_hub_checkpoint.py
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - run: python tools/apply_area_hub_checkpoint.py
      - uses: hacs/action@main
        with:
          category: integration
          ignore: description topics
  checkpoint:
    needs: [test, hassfest, hacs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Save tested source on the same development branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            feat/device-climate-controllers-*) ;;
            *) echo 'Refuse any non-development branch'; exit 1 ;;
          esac
          if [[ ! -d .github/changes/area-hubs ]]; then
            echo 'Committed source already validated; no patch to save'
            exit 0
          fi
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')"
          [[ "$current" == "$GITHUB_SHA" ]] || { echo 'Branch changed; not overwriting'; exit 1; }
          python tools/apply_area_hub_checkpoint.py
          git rm -r .github/changes/area-hubs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: register area hubs and group managed device entities under their area'
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Archive verified source only
        run: git archive --format=tar.gz -o source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: controller-source
          path: source.tar.gz
          retention-days: 3
