name: Synchronize Home Environment Advisor translations

on:
  push:
    branches:
      - 'feat/home-environment-advisor-*'
    paths:
      - 'apply_environment_i18n.py'
      - 'generate_translations.py'
      - '.github/i18n-request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-environment-advisor-i18n-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate all shipped locale files
        run: python generate_translations.py
      - name: Commit regenerated canonical strings and locales
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/air_quality_advisor/strings.json custom_components/air_quality_advisor/translations/
          if git diff --cached --quiet; then
            echo 'All translations already synchronized'
          else
            git commit -m 'i18n: synchronize Home Environment Advisor configuration'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
