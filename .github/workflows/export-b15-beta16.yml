name: Export exact b15 source for beta16 work
on:
  push:
    branches: ['chore/export-b15-beta16-20261023']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e94373ea5c813da9d9ab9a999aed1d8a819ddfdb
          persist-credentials: false
      - run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: b15-exact-source
          path: source.tar.gz
          retention-days: 1
