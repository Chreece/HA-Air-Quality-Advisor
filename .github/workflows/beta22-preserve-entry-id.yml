name: Beta22 preserve config-entry identity
on:
  push:
    branches:
      - 'fix/beta22-preserve-config-entry-id-20261023'
      - 'beta/v0.6.0b22'

permissions:
  contents: read

concurrency:
  group: beta22-preserve-entry-id-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Full regression suite
        run: |
          python -m pytest -q tests
          python generate_translations.py
          python -m compileall -q custom_components
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend checks
        run: |
          node --check custom_components/environment_manager/frontend/air-quality-advisor-card.js
          node tests/card_test.cjs
      - name: Canonical package and beta22 assertions
        run: |
          test -d custom_components/environment_manager
          test ! -d custom_components/enviroment_manager
          test ! -d custom_components/air_quality_advisor
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('custom_components/environment_manager')
          m=json.loads((p/'manifest.json').read_text())
          assert m['domain']=='environment_manager'
          assert m['version']=='0.6.0b22'
          migration=(p/'domain_migration.py').read_text()
          assert 'async_remove(legacy.entry_id)' not in migration
          assert 'new_config_entry_id=' not in migration
          assert '_reindex_entry_domain(hass, legacy, DOMAIN)' in migration
          PY
      - name: Require reproducible generated catalogs on release branch
        if: github.ref == 'refs/heads/beta/v0.6.0b22'
        run: git diff --exit-code -- custom_components/environment_manager/strings.json custom_components/environment_manager/translations custom_components/environment_manager/equipment_text.py

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: description topics

  home_assistant:
    name: HA 2026.10 exact-ID migration from b19 and b20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install 'homeassistant==2026.10.0'
      - run: |
          python tools/verify_domain_migration_ha.py
          python tools/verify_room_hubs_ha.py
          python tools/verify_room_setup_ha.py
          python tools/verify_beta15_settings_ha.py

  publish_beta:
    if: github.ref == 'refs/heads/beta/v0.6.0b22'
    needs: [test, hassfest, hacs, home_assistant]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify final source metadata
        run: |
          python generate_translations.py
          git diff --exit-code -- custom_components/environment_manager/strings.json custom_components/environment_manager/translations custom_components/environment_manager/equipment_text.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('custom_components/environment_manager/manifest.json').read_text())
          r=json.loads(Path('.github/release-request.json').read_text())
          assert m['domain']=='environment_manager'
          assert m['version']==r['version']=='0.6.0b22'
          assert r['channel']=='beta'
          assert r['release_branch']=='beta/v0.6.0b22'
          assert Path('.github/releases/v0.6.0b22.md').stat().st_size > 1800
          PY
      - name: Package and verify manual ZIP
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -q -r dist/HA-Home-Environment-Manager-v0.6.0b22.zip custom_components/environment_manager -x '*__pycache__*' '*.pyc' '*.pyo'
          python - <<'PY'
          import json, zipfile
          p='dist/HA-Home-Environment-Manager-v0.6.0b22.zip'
          prefix='custom_components/environment_manager/'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert all(n.startswith(prefix) for n in z.namelist())
              assert not any('enviroment_manager/' in n or 'air_quality_advisor/' in n for n in z.namelist())
              manifest=json.loads(z.read(prefix+'manifest.json'))
              assert manifest['domain']=='environment_manager'
              assert manifest['version']=='0.6.0b22'
          PY
          sha256sum dist/HA-Home-Environment-Manager-v0.6.0b22.zip > dist/HA-Home-Environment-Manager-v0.6.0b22.zip.sha256
      - name: Publish opt-in beta, never stable Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/beta/v0.6.0b22" --jq '.object.sha')"
          test "$current" = "$GITHUB_SHA"
          if gh release view v0.6.0b22 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.6.0b22" >/dev/null 2>&1; then
            echo 'Existing orphan tag; refusing to overwrite'
            exit 1
          fi
          gh release create v0.6.0b22 \
            dist/HA-Home-Environment-Manager-v0.6.0b22.zip \
            dist/HA-Home-Environment-Manager-v0.6.0b22.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Home Environment Manager v0.6.0 beta 22' \
            --notes-file .github/releases/v0.6.0b22.md --prerelease --latest=false
