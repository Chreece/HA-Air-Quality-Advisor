name: Generate README card screenshots (on request only)

# Avoid noisy CI: only the explicit screenshot request triggers a write.
on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/home-environment-*']
    paths:
      - '.github/screenshot-request.json'

permissions:
  contents: write

concurrency:
  group: air-quality-advisor-readme-screenshots
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install screenshot dependencies
        run: |
          python -m pip install pillow playwright
          python -m playwright install --with-deps chromium
      - name: Render real card component with demo states
        run: python tools/generate_readme_screenshots.py
      - name: Validate generated screenshots
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('.github/assets/screenshots')
          names=(
             'dashboard-climate-coordination.png',
             'dashboard-climate-coordination-mobile.png',
             'dashboard-overview-light.png','dashboard-greek-dark.png',
             'dashboard-mobile.png','dashboard-outdoor-alert.png',
             'dashboard-science-desktop.png','dashboard-science-mobile.png'
          )
          for name in names:
              path=root/name
              assert path.is_file(),name
              with Image.open(path) as im:
                  im.verify()
              with Image.open(path) as im:
                  assert im.width >= 290 and im.height >= 600,(name,im.size)
              assert path.stat().st_size < 500_000,(name,path.stat().st_size)
              print(name,path.stat().st_size,'bytes')
          PY
      - name: Commit screenshot files only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/assets/screenshots/
          if git diff --cached --quiet; then
            echo 'Screenshots unchanged'
          else
            git commit -m 'docs: update rendered Home Environment Manager screenshots'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
